<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>casino | hope you are all in</title>
  <meta name="theme-color" content="#162311">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="casino">
  <main class="cd">
    <nav class="cd-top" aria-label="Pages">
      <span>casino</span>
      <a href="index.html">home</a>
    </nav>

    <div class="casino-hero">
      <h1 class="cd-title">hope you are<br>all in</h1>

      <button class="cd-pic" type="button" data-move="flip" aria-label="Flip the poker cat">
        <img src="images/casino-1.jpeg" alt="Black and white cat at a poker table with cards and chips">
      </button>
    </div>

    <section id="spins" aria-label="Your spins"></section>

    <h2 class="section-title">choose your machine</h2>

    <div class="machines">
      <a class="machine-tile" href="claw.html" data-machine>
        <span class="machine-emoji" aria-hidden="true">🧸</span>
        <span>
          <span class="machine-name">claw machine</span>
          <span class="machine-hint">push the button and grab a plushie</span>
        </span>
      </a>
      <a class="machine-tile" href="slots.html" data-machine>
        <span class="machine-emoji" aria-hidden="true">🎰</span>
        <span>
          <span class="machine-name">slot machine</span>
          <span class="machine-hint">pull the lever and line up three in a row</span>
        </span>
      </a>
    </div>

    <section class="prizes" id="prizes" hidden>
      <h2>your prizes</h2>
      <ul></ul>
    </section>
  </main>

  <script src="casino.js"></script>
  <script>
    Casino.panel(document.getElementById("spins"));
    Casino.prizesList(document.getElementById("prizes"));
    Casino.wiggle();

    // без спинов к автомату не пускаем
    document.querySelectorAll("[data-machine]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        if (!Casino.guard()) e.preventDefault();
      });
    });
  </script>
</body>
</html>
