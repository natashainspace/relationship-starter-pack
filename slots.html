  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#162311">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">

<body class="casino">
  <main class="cd">
    <nav class="cd-top" aria-label="Pages">
      <span>slot machine</span>
      <a href="casino.html">back to casino</a>

    <h1 class="cd-title">three in<br>a row</h1>

    <div class="machine-layout">
      <div class="machine-stage">
        <svg class="machine-svg" id="machine" viewBox="10 80 420 400" role="img" aria-label="Slot machine with three reels and a lever">
          <defs>
            <!-- значки на барабанах: ракета, планета с кольцом, летающая тарелка -->
            <symbol id="sym-rocket" viewBox="0 0 60 60">
              <g transform="rotate(35 30 30)" stroke="#1D1D2B" stroke-width="3" stroke-linejoin="round">
                <path d="M24 45 Q30 60 36 45 Z" fill="#FFB020"/>
                <path d="M21 35 L12 47 L23 44 Z" fill="#E8473A"/>
                <path d="M39 35 L48 47 L37 44 Z" fill="#E8473A"/>
                <path d="M30 5 C41 13 42 32 38 45 H22 C18 32 19 13 30 5 Z" fill="#DCE7F7"/>
                <path d="M30 5 C35 9 37.5 12.5 38.5 16 H21.5 C22.5 12.5 25 9 30 5 Z" fill="#E8473A"/>
                <circle cx="30" cy="26" r="6" fill="#3B7BE8"/>
              </g>
            </symbol>
            <symbol id="sym-planet" viewBox="0 0 60 60">
              <g stroke="#1D1D2B" stroke-linejoin="round">
                <g transform="rotate(-20 30 30)">
                  <ellipse cx="30" cy="30" rx="27" ry="8.5" fill="none" stroke-width="8"/>
                  <ellipse cx="30" cy="30" rx="27" ry="8.5" fill="none" stroke="#9C7CF0" stroke-width="3.5"/>
                </g>
                <circle cx="30" cy="30" r="15" fill="#F7B23A" stroke-width="3"/>
                <path d="M17 25 Q30 21 43 25 M16.5 34 Q30 38 43.5 34" fill="none" stroke="#E8622F" stroke-width="3"/>
                <g transform="rotate(-20 30 30)">
                  <path d="M3 30 A27 8.5 0 0 0 57 30" fill="none" stroke-width="8"/>
                  <path d="M3 30 A27 8.5 0 0 0 57 30" fill="none" stroke="#9C7CF0" stroke-width="3.5"/>
                </g>
              </g>
            </symbol>
            <symbol id="sym-ufo" viewBox="0 0 60 60">
              <g stroke="#1D1D2B" stroke-width="3" stroke-linejoin="round">
                <path d="M17 33 C17 15 43 15 43 33 Z" fill="#A8EEF2"/>
                <circle cx="30" cy="26" r="6" fill="#8FDCA6" stroke-width="2.5"/>
                <circle cx="27.6" cy="25.5" r="1.4" fill="#1D1D2B" stroke="none"/>
                <circle cx="32.4" cy="25.5" r="1.4" fill="#1D1D2B" stroke="none"/>
                <ellipse cx="30" cy="36" rx="25" ry="8.5" fill="#B9BCCF"/>
                <circle cx="16" cy="37" r="3" fill="#FFD54A" stroke-width="2"/>
                <circle cx="30" cy="39.5" r="3" fill="#FFD54A" stroke-width="2"/>
                <circle cx="44" cy="37" r="3" fill="#FFD54A" stroke-width="2"/>
              </g>
            </symbol>
            <linearGradient id="reel-shade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#1D1D2B" stop-opacity=".35"/>
              <stop offset=".3" stop-color="#1D1D2B" stop-opacity="0"/>
              <stop offset=".7" stop-color="#1D1D2B" stop-opacity="0"/>
              <stop offset="1" stop-color="#1D1D2B" stop-opacity=".35"/>
            </linearGradient>
            <clipPath id="reel-clip-0"><rect x="110" y="256" width="56" height="118"/></clipPath>
            <clipPath id="reel-clip-1"><rect x="172" y="256" width="56" height="118"/></clipPath>
            <clipPath id="reel-clip-2"><rect x="234" y="256" width="56" height="118"/></clipPath>
          </defs>

          <!-- блёстки вокруг -->
          <g fill="#E8ECD1">
            <path d="M48 120 Q52 136 66 140 Q52 144 48 160 Q44 144 30 140 Q44 136 48 120 Z"/>
            <path d="M378 96 Q381 108 392 111 Q381 114 378 126 Q375 114 364 111 Q375 108 378 96 Z"/>
            <path d="M40 300 Q42 308 50 310 Q42 312 40 320 Q38 312 30 310 Q38 308 40 300 Z"/>
            <path d="M398 250 Q400 258 408 260 Q400 262 398 270 Q396 262 388 260 Q396 258 398 250 Z"/>
            <circle cx="70" cy="210" r="3"/><circle cx="380" cy="180" r="3"/><circle cx="58" cy="390" r="3"/>
          </g>

          <g stroke="#1D1D2B" stroke-width="5" stroke-linejoin="round">
            <!-- арка с лампочками -->
            <path d="M75 192 A125 125 0 0 1 325 192 Z" fill="#F9C6D8"/>
            <path d="M101 192 A99 99 0 0 1 299 192 Z" fill="#F7B23A"/>
          </g>
          <g id="bulbs" stroke="#1D1D2B" stroke-width="2.5"></g>

          <g stroke="#1D1D2B" stroke-width="5" stroke-linejoin="round">
            <!-- табличка и корпус -->
            <rect x="82" y="178" width="236" height="50" rx="10" fill="#F9C6D8"/>
            <rect x="78" y="226" width="244" height="186" rx="6" fill="#F9C6D8"/>
            <rect x="94" y="240" width="212" height="150" rx="16" fill="#F07E3A"/>
            <rect x="102" y="248" width="196" height="134" rx="12" fill="#F9C6D8"/>
          </g>
          <text x="200" y="211" text-anchor="middle" font-size="22" fill="#E8622F">space slots</text>

          <!-- барабаны -->
          <g id="reels"></g>
          <g fill="none" stroke="#1D1D2B" stroke-width="4">
            <rect x="110" y="256" width="56" height="118" rx="3"/>
            <rect x="172" y="256" width="56" height="118" rx="3"/>
            <rect x="234" y="256" width="56" height="118" rx="3"/>
          </g>
          <!-- стрелочки линии выигрыша -->
          <path d="M103 307 L111 315 L103 323 Z M297 307 L289 315 L297 323 Z" fill="#E8473A" stroke="#1D1D2B" stroke-width="2"/>

          <g stroke="#1D1D2B" stroke-width="5" stroke-linejoin="round">
            <!-- нижний лоток -->
            <rect x="62" y="410" width="276" height="62" rx="8" fill="#F9C6D8"/>
            <rect x="62" y="410" width="276" height="15" rx="4" fill="#F07E3A"/>
            <!-- крепление рычага -->
            <rect x="322" y="298" width="26" height="80" rx="7" fill="#A9B266"/>
          </g>
          <g stroke="#1D1D2B" stroke-width="3.5" fill="#F06A3A">
            <ellipse cx="124" cy="444" rx="22" ry="8"/>
            <ellipse cx="200" cy="444" rx="22" ry="8"/>
            <ellipse cx="276" cy="444" rx="22" ry="8"/>
            <path d="M200 466 C196 461 189 461 189 456 C189 452 194 450 200 455 C206 450 211 452 211 456 C211 461 204 461 200 466 Z" fill="#F7A1BC"/>
          </g>

          <!-- рычаг сбоку: запускает игру -->
          <g class="hit lever" id="lever" role="button" tabindex="0" aria-label="Pull the lever to play">
            <circle class="hit-ring" id="lever-ring" cx="354" cy="190" r="27" fill="none" stroke="#E8ECD1" stroke-width="3"/>
            <line id="lever-stick-out" x1="335" y1="338" x2="352" y2="196" stroke="#1D1D2B" stroke-width="12" stroke-linecap="round"/>
            <line id="lever-stick" x1="335" y1="338" x2="352" y2="196" stroke="#C9CF8E" stroke-width="5" stroke-linecap="round"/>
            <g id="lever-ball">
              <circle cx="0" cy="0" r="18" fill="#F06A3A" stroke="#1D1D2B" stroke-width="4"/>
              <ellipse cx="-6" cy="-6" rx="6" ry="4" fill="#FFB39A"/>
            </g>
            <circle cx="335" cy="338" r="8" fill="#7E8740" stroke="#1D1D2B" stroke-width="3"/>
            <rect x="315" y="160" width="70" height="190" fill="transparent"/>
          </g>
        </svg>
        <p class="machine-help">pull the lever on the side of the machine</p>
      </div>

      <section id="spins" aria-label="Your spins"></section>
    </div>
  </main>

  <script src="casino.js"></script>
  <script>
    Casino.panel(document.getElementById("spins"));

    var NS = "http://www.w3.org/2000/svg";
    var svg = document.getElementById("machine");

    function node(tag, attrs, parent) {
      var e = document.createElementNS(NS, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(e);
      return e;
    }

    // ===== лампочки на арке =====
    var bulbs = document.getElementById("bulbs");
    for (var a = 180; a >= 0; a -= 15) {
      var rad = a * Math.PI / 180;
      node("circle", { "class": "bulb", cx: (200 + 112 * Math.cos(rad)).toFixed(1),
                       cy: (192 - 112 * Math.sin(rad)).toFixed(1), r: 5.5, fill: "#FFF6C9" }, bulbs);
    }

    // ===== анимация =====
    function tween(ms, fn, e) {
      return new Promise(function (done) {
        var t0 = performance.now();
        function frame(now) {
          var p = Math.min(1, (now - t0) / ms);
          fn(e ? e(p) : p);
          if (p < 1) requestAnimationFrame(frame); else done();
        }
        requestAnimationFrame(frame);
      });
    }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    var easeIn = function (p) { return p * p; };
    var easeOut = function (p) { return 1 - (1 - p) * (1 - p); };
    // разгон, долгая прокрутка и мягкая остановка с лёгким «перелётом»
    var reelEase = function (p) {
      var c1 = 1.1, c3 = c1 + 1;
      return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
    };

    // ===== барабаны =====
    var SYMS = ["rocket", "planet", "ufo"];
    var REEL_X = [110, 172, 234], CELL = 60, CENTER_Y = 315;
    function randSym() { return SYMS[Math.floor(Math.random() * SYMS.length)]; }

    var reelsLayer = document.getElementById("reels");
    var reels = REEL_X.map(function (x, i) {
      var g = node("g", { "clip-path": "url(#reel-clip-" + i + ")" }, reelsLayer);
      node("rect", { x: x, y: 256, width: 56, height: 118, fill: "#FFFDF7" }, g);
      var strip = node("g", {}, g);
      node("rect", { x: x, y: 256, width: 56, height: 118, fill: "url(#reel-shade)" }, g);
      var r = { x: x, strip: strip, vis: [randSym(), randSym(), randSym()] };
      build(r, r.vis, 1);
      return r;
    });

    // раскладывает значки в столбик и ставит нужную клетку в центр окошка
    function build(r, list, k) {
      r.strip.innerHTML = "";
      list.forEach(function (sym, j) {
        node("use", { href: "#sym-" + sym, x: r.x + 3, y: j * CELL + 5, width: 50, height: 50 }, r.strip);
      });
      setOffset(r, k);
    }
    function setOffset(r, k) {
      r.strip.setAttribute("transform", "translate(0 " + (CENTER_Y - CELL / 2 - k * CELL).toFixed(2) + ")");
    }

    function spinReel(r, target, i) {
      var top = randSym(), bottom = randSym();
      var list = [top, target, bottom];
      var n = 14 + i * 6;
      for (var j = 0; j < n; j++) list.push(randSym());
      list.push(r.vis[0], r.vis[1], r.vis[2]);
      var from = list.length - 2, to = 1;
      build(r, list, from);
      return tween(1500 + i * 550, function (p) { setOffset(r, from + (to - from) * p); }, reelEase)
        .then(function () {
          r.vis = [top, target, bottom];
          build(r, r.vis, 1);
        });
    }

    // что показать на барабанах: три одинаковых - выигрыш
    function faces(outcome) {
      if (outcome.win) { var s = randSym(); return [s, s, s]; }
      if (Math.random() < .5) {                        // почти получилось
        var a = randSym(), b;
        do { b = randSym(); } while (b === a);
        return [a, a, b];
      }
      var f;
      do { f = [randSym(), randSym(), randSym()]; } while (f[0] === f[1] && f[1] === f[2]);
      return f;
    }

    // ===== рычаг =====
    var PIVOT = { x: 335, y: 338 }, TIP = { dx: 17, dy: -142 };
    var stick = document.getElementById("lever-stick");
    var stickOut = document.getElementById("lever-stick-out");
    var ball = document.getElementById("lever-ball");
    var ring = document.getElementById("lever-ring");

    function setLever(s) {               // s: 1 - вверху, -0.75 - опущен до конца
      var x = PIVOT.x + TIP.dx * s, y = PIVOT.y + TIP.dy * s;
      [stick, stickOut].forEach(function (l) { l.setAttribute("x2", x.toFixed(1)); l.setAttribute("y2", y.toFixed(1)); });
      ball.setAttribute("transform", "translate(" + x.toFixed(1) + " " + (y - 6 * s).toFixed(1) + ")");
      ring.setAttribute("cx", x.toFixed(1));
      ring.setAttribute("cy", (y - 6 * s).toFixed(1));
    }
    setLever(1);

    var lever = document.getElementById("lever");
    var busy = false;

    async function pull() {
      if (busy) return;
      if (!Casino.guard()) return;
      var outcome = Casino.spin("slot machine");
      if (!outcome) { Casino.outOfSpins(); return; }
      busy = true;
      svg.classList.add("is-busy", "is-blinking");
      lever.classList.add("is-off");

      await tween(300, function (p) { setLever(1 - 1.75 * p); }, easeIn);
      var target = faces(outcome);
      var spinning = Promise.all(reels.map(function (r, i) { return spinReel(r, target[i], i); }));
      await tween(450, function (p) { setLever(-.75 + 1.75 * p); }, easeOut);
      await spinning;

      if (outcome.win) await wait(1100); else svg.classList.remove("is-blinking");
      await wait(350);
      svg.classList.remove("is-blinking");
      Casino.result(outcome);
      busy = false;
      svg.classList.remove("is-busy");
      lever.classList.remove("is-off");
    }

    lever.addEventListener("click", pull);
    lever.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pull(); }
    });

    // зашёл без спинов - сразу говорим
    if (Casino.total() === 0) setTimeout(Casino.outOfSpins, 400);
  </script>
</body>
</html>
